[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "banditlab"
version = "0.2.1"
description = "Multi-Armed Bandit Framework with support for contextual, GLM, NN, GP-based and delayed methods"
authors = ["Egor Suraveykin <surikkatik@gmail.com>"]
readme = "README.md"
license = "MIT"

packages = [
    { include = "mab_framework" },
    { include = "streamlit_bandit" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "1.23.5"
pandas = ">=1.5.0,<2.0.0"
scikit-learn = ">=1.3.0"
scipy = "1.9.3"
pyyaml = ">=6.0"
coba = ">=8.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.11.2,<0.12.0"
plotly = ">=5.0.0"
streamlit = ">=1.28.0"
torch = ">=2.0.0"
cvxpy = ">=1.0.0"

[tool.poetry.scripts]
bandit = "mab_framework.run:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"
ipython = ">=8.0.0"
jupyter = ">=1.0.0"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true